    .brand-lockup{display:flex;flex-direction:column;align-items:center;width:min(260px,55vw);position:relative;z-index:1}.brand-logo{display:block;width:100%;height:auto;object-fit:contain;filter:drop-shadow(0 14px 18px rgba(23,53,47,.13))}.brand-credit{margin-top:4px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.9);color:var(--ink);font-size:24px;font-weight:900;letter-spacing:.02em;box-shadow:0 6px 16px rgba(23,53,47,.08)}.hero-logo{float:right;margin:-12px 0 18px 32px}.result-logo{float:none;clear:both;width:min(220px,50vw);margin:30px auto 4px;left:auto;right:auto;text-align:center}.question-num{font-size:13px;color:var(--green);font-weight:900;margin-bottom:14px}.question h2{font-size:clamp(25px,4vw,39px);letter-spacing:-.035em;line-height:1.3;margin-bottom:12px}.helper{color:var(--muted);line-height:1.6;margin-bottom:26px}.answers{display:grid;gap:11px}.answer{display:flex;align-items:center;text-align:left;width:100%;border:1px solid var(--line);border-radius:17px;background:#fff;padding:17px 18px;color:var(--ink);font-weight:800;line-height:1.4;cursor:pointer;transition:.18s}.answer .n{flex:0 0 31px;color:var(--green);font-weight:900}.answer:hover,.answer:focus-visible{border-color:var(--green2);transform:translateX(5px);box-shadow:0 8px 22px rgba(31,157,114,.1);outline:none}.back{margin-top:18px;border:0;background:transparent;color:var(--muted);font-weight:800;cursor:pointer;padding:8px 0}.back:hover{color:var(--ink)}

ttom:0}.rank-row.current{background:#effaf5}.rank-num{font-weight:950;color:var(--green)}.rank-count{text-align:right;font-weight:900}.restart{display:block;width:100%;margin-top:24px;border:0;border-radius:17px;padding:19px;background:var(--yellow);color:var(--ink);font-size:18px;font-weight:950;cursor:pointer;box-shadow:0 10px 24px rgba(255,212,93,.3)}.restart:hover{transform:translateY(-2px)}.footer{text-align:center;color:#788780;font-size:12px;margin-top:18px}

    :root{--ink:#123d35;--muted:#56746b;--green:#138b66;--green2:#48c997;--yellow:#ffd35a;--orange:#ff8f61;--line:#d5e8de;--shadow:0 22px 54px rgba(22,83,65,.13),0 3px 9px rgba(22,83,65,.05)}
    body{background:radial-gradient(circle at 8% 9%,#c9f5df 0 10%,transparent 25%),radial-gradient(circle at 92% 92%,#ffe7a2 0 9%,transparent 24%),linear-gradient(135deg,#eafff5 0%,#fff9df 53%,#fff0e8 100%)}
    .app{width:min(1080px,calc(100% - 40px));padding:30px 0 54px}.topbar{margin-bottom:22px;padding:0 4px}.brand{gap:12px;font-size:15px;letter-spacing:-.02em}.brand-mark{width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,var(--ink),#1b5a4b);box-shadow:0 9px 18px rgba(18,61,53,.22)}

    .start{padding:18px 27px;border:2px solid var(--ink);border-radius:17px;font-size:17px;box-shadow:0 12px 0 #0a2d27,0 17px 27px rgba(18,61,53,.2);transition:transform .18s ease,box-shadow .18s ease}.start:hover{transform:translateY(-3px);box-shadow:0 15px 0 #0a2d27,0 21px 28px rgba(18,61,53,.19)}.start:focus-visible,.restart:focus-visible,.answer:focus-visible,.back:focus-visible{outline:3px solid var(--orange);outline-offset:4px}.note{margin-top:19px;font-size:13px;color:#698078}.brand-credit{font-size:20px}.hero-logo{margin:-16px 2px 20px 38px;width:min(270px,50vw)}

<body>
  <main class="app">
    <header class="topbar"><div class="brand"><span class="brand-mark">M</span><span>사장의 마케팅 게임</span></div><div class="progress-wrap" id="progressWrap" hidden><div class="progress-meta"><span id="stepText">진단 준비</span><span id="percentText">0%</span></div><div class="progress"><i id="progressBar"></i></div></div></header>
    <section class="mini-guide" id="miniGuide"><div class="mini"><b>필수 마케팅</b><span id="mustMini">진단 후 알려드려요</span></div><div class="mini"><b>선택 마케팅</b><span id="optionalMini">진단 후 알려드려요</span></div></section>
    <article class="card" id="card" aria-live="polite"></article>
    <div class="footer">많이 하는 마케팅보다, 나에게 맞는 마케팅부터.</div>
  </main>
  <script>
  (()=>{
    const TYPES={search:{name:'검색해서 찾아오는 사장님',short:'검색발견형',icon:'🔎'},local:{name:'동네를 잡는 사장님',short:'지역공략형',icon:'📍'},info:{name:'알려줘서 파는 사장님',short:'정보신뢰형',icon:'📚'},relation:{name:'계속 연락하는 사장님',short:'관계관리형',icon:'🤝'},visual:{name:'보여줘서 파는 사장님',short:'비주얼콘텐츠형',icon:'📸'},video:{name:'영상으로 설득하는 사장님',short:'영상설득형',icon:'🎥'},direct:{name:'고객을 찾아가는 사장님',short:'직접공략형',icon:'🎯'}};
    const D={};Object.keys(TYPES).forEach(k=>D[k]=0);
    const W=(...x)=>{const o={};for(let i=0;i<x.length;i+=2)o[x[i]]=x[i+1];return o};
    const questions=[
      ['고객은 당신의 사업을 처음 어떻게 알게 되나요?','가장 흔한 첫 만남을 골라주세요.',[['네이버·구글 등에서 검색',W('search',5,'info',1,'local',2)],['지나가다가 발견',W('local',5,'visual',1)],['인스타그램·SNS',W('visual',5,'relation',1)],['블로그나 콘텐츠',W('info',4,'search',3)],['지인 소개',W('relation',3,'info',2)],['내가 직접 고객에게 알림',W('direct',5,'relation',2)],['기존 고객에게 다시 알림',W('relation',5,'direct',2)]]],
      ['구매 전에 정보를 얼마나 알아봐야 하나요?','상품·서비스를 이해하는 데 필요한 설명의 양입니다.',[['거의 그렇지 않다',W('visual',2,'local',1)],['조금 알아본다',W('info',2,'search',1)],['꽤 많이 알아본다',W('info',4,'search',2)],['전문적인 설명이 반드시 필요하다',W('info',5,'video',2,'search',2)]]],
      ['고객은 얼마나 자주 다시 구매하거나 방문하나요?','재방문과 반복 구매의 비중을 생각해보세요.',[['거의 한 번만 이용',W('search',2,'direct',1)],['가끔 다시 이용',W('relation',2)],['정기적으로 이용',W('relation',4,'direct',1)],['계속 이용하는 고객이 많다',W('relation',5,'info',1)]]],
      ["사업에서 '거리'가 얼마나 중요한가요?",'고객과 사업장의 물리적 거리를 기준으로 답해주세요.',[['전국 어디서든 고객이 올 수 있다',W('search',2,'info',2)],['어느 지역이든 상관없다',W('info',2,'video',1)],['주변 고객이 중요하다',W('local',4,'search',1)],['대부분 가까운 고객이다',W('local',5,'visual',1)]]],
      ['고객이 검색할 만한 명확한 키워드가 있나요?','업종명, 지역명, 문제 상황처럼 고객이 입력할 단어입니다.',[['거의 없다',W('relation',1,'visual',1)],['조금 있다',W('search',2,'info',1)],['꽤 많다',W('search',4,'info',2)],['그 키워드로 많이 검색한다',W('search',5,'local',2)]]],

    const ATTENDANCE_WEB_APP_URL='https://script.google.com/macros/s/AKfycbzQfiJzvzyYOlbILqj-PKMf8TeKg3RwAlFfhtCwi6ghwQLox4W7hVaEdOwI7hpKTkVYGw/exec';
    function setupRegistration(){
      const form=document.querySelector('#registrationForm'),submit=document.querySelector('#registrationSubmit'),status=document.querySelector('#registrationStatus'),start=document.querySelector('#start');
      start.disabled=true;start.onclick=()=>showQuestion(0);
      const setStatus=(message,type='')=>{status.textContent=message;status.className='registration-status'+(type?' '+type:'')};
      form.addEventListener('submit',async event=>{
        event.preventDefault();
        if(!form.reportValidity())return;
        const name=document.querySelector('#attendeeName').value.trim(),industry=document.querySelector('#attendeeIndustry').value.trim(),email=document.querySelector('#attendeeEmail').value.trim();
        if(!name||!industry||!email){setStatus('성명, 업종, 이메일을 모두 입력해 주세요.','error');return}
        submit.disabled=true;submit.textContent='전송 중...';setStatus('참여 정보를 안전하게 저장하고 있습니다.');
        const payload=new URLSearchParams({action:'save',name,industry,business:industry,email,'성명':name,'업종':industry,'이메일':email,phone:email,contact:email,note:industry});
        try{
          const response=await fetch(ATTENDANCE_WEB_APP_URL,{method:'POST',body:payload,redirect:'follow'});
          const raw=await response.text();let result={};try{result=JSON.parse(raw)}catch(error){}
          const accepted=response.ok&&(result.success===true||String(result.status||'').toLowerCase()==='success'||/저장|success/i.test(raw));
          if(!accepted)throw new Error(result.message||'정보를 저장하지 못했습니다. 잠시 후 다시 시도해 주세요.');
          participantRecord={name,industry,email,rowNumber:result.rowNumber||''};form.querySelectorAll('input').forEach(input=>input.disabled=true);submit.textContent='저장 완료';setStatus('저장되었습니다. 이제 진단을 시작해 주세요.','success');start.disabled=false;start.focus();
        }catch(error){submit.disabled=false;submit.textContent='다시 전송하기';setStatus(error.message||'전송 중 오류가 발생했습니다.','error')}
      });
    }
    async function saveDiagnosisResult(top,must){
      const status=document.querySelector('#resultSync');
      if(!status||!participantRecord)return;
      const marketingType=TYPES[top].name,marketingTools=must.map(tool=>tool.name).join(', ');
      const payload=new URLSearchParams({action:'updateResult',name:participantRecord.name,email:participantRecord.email,rowNumber:String(participantRecord.rowNumber||''),marketingType,marketingTools,'성명':participantRecord.name,'이메일':participantRecord.email,'유형':marketingType,'마케팅도구':marketingTools});
      status.textContent='진단 결과를 저장하고 있습니다.';
      try{
        let response=await fetch(ATTENDANCE_WEB_APP_URL,{method:'POST',body:payload,redirect:'follow'});
        let raw=await response.text(),result={};try{result=JSON.parse(raw)}catch(error){}
        if(!response.ok||result.success!==true){
          const compatiblePayload=new URLSearchParams({action:'save',name:participantRecord.name,industry:participantRecord.industry,email:participantRecord.email,marketingType,marketingTools,'성명':participantRecord.name,'업종':participantRecord.industry,'이메일':participantRecord.email,'유형':marketingType,'마케팅도구':marketingTools});
          response=await fetch(ATTENDANCE_WEB_APP_URL,{method:'POST',body:compatiblePayload,redirect:'follow'});
          raw=await response.text();result={};try{result=JSON.parse(raw)}catch(error){}
        }
        if(!response.ok||result.success!==true)throw new Error(result.message||'진단 결과를 저장하지 못했습니다.');
        status.textContent='마케팅 유형과 추천 도구가 Google Sheets에 저장되었습니다.';status.className='result-sync success';
      }catch(error){status.textContent=error.message||'결과 저장 중 오류가 발생했습니다.';status.className='result-sync error'}
    }    function intro(){current=-1;history.length=0;scores={...D};pw.hidden=true;guide.style.display='none';card.innerHTML=`<div class="screen hero">${logoBlock('hero-logo')}<span class="eyebrow">SMALL BUSINESS MARKETING QUEST</span><h1>사장의 마케팅<br><em>지금 나에게 필요한 마케팅 도구 찾기</em></h1><p class="lead">15번의 현실적인 선택으로 고객이 움직이는 길을 찾습니다. 잘하는 마케팅을 늘리기보다, 지금 먼저 시작할 도구를 골라드릴게요.</p><div class="chips"><span class="chip">7가지 마케팅 유형</span><span class="chip">13개 도구 우선순위</span><span class="chip">약 90초</span><span class="chip">기록 자동 저장</span></div><form class="registration-form" id="registrationForm" novalidate><div class="registration-head"><strong>진단 참여 정보를 입력해 주세요</strong><span>정보 저장이 완료되면 진단을 시작할 수 있습니다.</span></div><div class="registration-grid"><label class="registration-field"><span>성명</span><input id="attendeeName" name="name" type="text" autocomplete="name" maxlength="40" placeholder="성명을 입력하세요" required></label><label class="registration-field"><span>업종</span><input id="attendeeIndustry" name="industry" type="text" maxlength="60" placeholder="예: 음식점, 미용실" required></label><label class="registration-field"><span>이메일</span><input id="attendeeEmail" name="email" type="email" autocomplete="email" maxlength="120" placeholder="example@email.com" required></label></div><div class="registration-actions"><button class="registration-submit" id="registrationSubmit" type="submit">정보 저장하기</button><div class="registration-status" id="registrationStatus" role="status" aria-live="polite"></div></div></form><button class="start" id="start" disabled>진단 시작하기 →</button><small class="note">정보 저장이 완료된 뒤 진단을 시작할 수 있습니다.</small></div>`;setupRegistration()}
    function showQuestion(i){current=i;pw.hidden=false;guide.style.display='none';setProgress(i);const q=questions[i];card.innerHTML=`<div class="screen question"><div class="question-num">CHOICE ${String(i+1).padStart(2,'0')} · 전체 여정 ${i+2}/17</div><h2>${q[0]}</h2><p class="helper">${q[1]}</p><div class="answers">${q[2].map((a,n)=>`<button class="answer" data-i="${n}"><span class="n">${n+1}</span><span>${esc(a[0])}</span></button>`).join('')}</div>${i?'<button class="back" id="back">← 이전 선택으로</button>':''}</div>`;document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>choose(+b.dataset.i));if(i)document.querySelector('#back').onclick=goBack}
    function choose(ai){const weights=questions[current][2][ai][1];history.push({q:current,ai,weights});Object.entries(weights).forEach(([k,v])=>scores[k]+=v);if(current<questions.length-1)showQuestion(current+1);else result()}
    function goBack(){const last=history.pop();if(!last)return intro();Object.entries(last.weights).forEach(([k,v])=>scores[k]-=v);showQuestion(last.q)}
    function result(){setProgress(questions.length);const ranked=Object.entries(scores).sort((a,b)=>b[1]-a[1]);const max=Math.max(1,...ranked.map(x=>x[1]));const normalized=ranked.map(([k,v])=>[k,Math.round(30+v/max*65)]);const top=ranked[0][0],second=ranked[1][0];const toolRank=tools.map(t=>({...t,score:t.base+t.roles.reduce((s,r,idx)=>s+scores[r]*(t.weights?.[idx]??(idx?0.72:1)),0)})).sort((a,b)=>b.score-a.score);const must=toolRank.slice(0,3),optional=toolRank.slice(3,5),low=toolRank.slice(-3).reverse();document.querySelector('#mustMini').textContent=must.map(x=>x.name).join(' · ');document.querySelector('#optionalMini').textContent=optional.map(x=>x.name).join(' · ');guide.style.display='grid';const missions=missionFor(top,must);const savedRecords=saveRecord(top,normalized[0][1]);card.classList.add('result-card');card.innerHTML=`<div class="screen"><div class="result-top"><div><span class="eyebrow">당신의 마케팅 유형</span><h1>${TYPES[top].icon} ${TYPES[top].name}</h1><p>${description(top)}<br>동시에 <b>${TYPES[second].name}</b>의 강점도 큰 사업입니다.</p></div><div class="record">이번 판의 기록<br><b>선택 ${history.length}회</b><br>엔딩: <b>${TYPES[top].short}</b></div></div><div class="priority"><div class="priority-box must"><h3>필수 마케팅 · 지금 시작</h3><p>${must.map(x=>x.name).join(' · ')}</p></div><div class="priority-box optional"><h3>선택 마케팅 · 다음 단계</h3><p>${optional.map(x=>x.name).join(' · ')}</p></div></div><div class="interpret">당신은 <b>${TYPES[top].short.replace('형','')}</b>의 힘으로 신규 고객을 만들고, <b>${TYPES[second].short.replace('형','')}</b>의 강점으로 성과를 키울 가능성이 높습니다. 두 흐름을 연결하는 것이 이번 진단의 핵심입니다.</div><div class="result-sync" id="resultSync" role="status" aria-live="polite">진단 결과를 Google Sheets에 저장할 준비를 하고 있습니다.</div><h2 class="section-title">🧬 나의 마케팅 DNA</h2><div class="dna">${normalized.map(([k,v])=>`<div class="dna-row"><span>${TYPES[k].icon} ${TYPES[k].short}</span><div class="bar"><i style="width:${v}%"></i></div><b>${v}점</b></div>`).join('')}</div><h2 class="section-title">🏆 당신에게 가장 잘 맞는 도구</h2><div class="tool-list">${toolRank.slice(0,4).map((t,i)=>`<div class="tool"><b>${i+1}. ${t.name}</b><p>${t.desc}</p></div>`).join('')}</div><h2 class="section-title">⏸️ 지금 당장 하지 않아도 되는 것</h2><div class="low"><b>${low.map(x=>x.name).join(' · ')}</b><br>효과가 없는 도구라는 뜻은 아닙니다. 현재 사업에서는 위의 필수 마케팅에 시간과 예산을 먼저 모으는 편이 효율적입니다.</div><h2 class="section-title">🏅 누적 엔딩 순위표</h2><div class="ranking">${rankingHTML(savedRecords,top)}</div><h2 class="section-title">🚀 이번 주 첫 번째 마케팅 미션</h2><div class="mission">이번 주에 할 일은 딱 3개입니다.<ul>${missions.map(x=>`<li>☑ ${x}</li>`).join('')}</ul></div>${logoBlock('result-logo')}<button class="restart" id="restart">처음부터 다시하기</button></div>`;saveDiagnosisResult(top,must);document.querySelector('#restart').onclick=()=>{card.classList.remove('result-card');intro();scrollTo({top:0,behavior:'smooth'})};scrollTo({top:0,behavior:'smooth'})}
    function description(k){return{search:'고객이 필요한 순간, 검색을 통해 당신의 사업을 발견하는 구조입니다.',local:'가까운 고객의 발견과 방문을 매출로 연결하는 사업입니다.',info:'정보와 신뢰가 고객의 구매 결정을 만드는 사업입니다.',relation:'한 번 만난 고객과 꾸준히 연결될수록 강해지는 사업입니다.',visual:'말보다 사진과 분위기가 매력을 빠르게 전달하는 사업입니다.',video:'과정과 경험을 생생하게 보여줄 때 설득력이 커지는 사업입니다.',direct:'정확한 고객을 찾아 먼저 제안할 때 성과가 나는 사업입니다.'}[k]}
    function missionFor(k,m){const common={search:['네이버·구글·카카오 지도 정보를 최신화하기','고객이 검색할 질문 5개 적기','그중 하나를 블로그 글로 발행하기'],local:['지도 3곳의 영업시간·사진·소개를 통일하기','대표 메뉴·서비스 사진 5장 올리기','가까운 고객용 한 줄 혜택 만들기'],info:['고객이 자주 묻는 질문 5개 적기','가장 중요한 질문을 700자 글로 쓰기','글 끝에 문의·예약 방법 넣기'],relation:['기존 고객 명단을 한곳에 정리하기','이번 주 소식 한 문장 만들기','부담 없는 재방문 메시지 1회 보내기'],visual:['대표 상품의 전·후 또는 사용 장면 촬영하기','인스타그램 소개 문구를 고객 관점으로 고치기','사진 3장으로 한 게시물 발행하기'],video:['고객 질문 하나를 60초 대본으로 만들기','스마트폰으로 설명 영상 1개 촬영하기','제목과 문의 방법을 넣어 게시하기'],direct:['가장 원하는 고객 한 문장으로 정의하기','연락 가능한 잠재고객 20명 정리하기','혜택보다 문제 해결 중심의 첫 메시지 보내기']}[k];return common||m.slice(0,3).map(x=>x.name+' 시작하기')}
    intro();
  })();
  </script>
